apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steambot-ingress
  namespace: steambot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Sticky sessions — сессия браузера должна идти на один и тот же под
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "STEAMBOT_ROUTE"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - communityrig.ru
        - www.communityrig.ru
      secretName: steambot-tls
  rules:
    - host: communityrig.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: steambot-server
                port:
                  number: 80
    - host: www.communityrig.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: steambot-server
                port:
                  number: 80
