version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: steambot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       steambot
      POSTGRES_USER:     steambot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - steambot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steambot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Run Migrations (одноразово при старте) ────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: steambot-migrate
    command: ["node", "db/migrate.js"]
    working_dir: /app/server
    environment:
      DB_TYPE:     postgresql
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     steambot
      DB_USER:     steambot
      DB_PASSWORD: ${DB_PASSWORD:?err}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - steambot-net
    restart: on-failure

  # ── Steam Poster Bot — SaaS Server ────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: steambot-server
    restart: unless-stopped
    environment:
      NODE_ENV:    production
      PORT:        4000
      DB_TYPE:     postgresql
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     steambot
      DB_USER:     steambot
      DB_PASSWORD: ${DB_PASSWORD:?err}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET:          ${JWT_SECRET:?err}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@steambot.local}
      ADMIN_PASSWORD:      ${ADMIN_PASSWORD:?err}
      APP_URL:             ${APP_URL:-https://your-domain.com}
      TRIAL_DAYS:          ${TRIAL_DAYS:-7}
      # Stripe (опционально)
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Email (опционально)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@steambot.local}
      # Playwright
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SLOW_MO:  "100"
    volumes:
      - server-data:/app/data
      - server-logs:/app/logs
    expose:
      - "4000"
    networks:
      - steambot-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx reverse proxy + SSL ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: steambot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro            # сертификаты (Let's Encrypt или самоподписанные)
      - nginx-cache:/var/cache/nginx
    depends_on:
      - server
    networks:
      - steambot-net

  # ── Certbot (Let's Encrypt) ────────────────────────────────────────────────
  # Раскомментируйте для автоматического получения SSL-сертификата
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./ssl/letsencrypt:/etc/letsencrypt
  #     - ./ssl/www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot -d your-domain.com --email admin@your-domain.com --agree-tos --no-eff-email

volumes:
  postgres-data:
  server-data:
  server-logs:
  nginx-cache:

networks:
  steambot-net:
    driver: bridge
