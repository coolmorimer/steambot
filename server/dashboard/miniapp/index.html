<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Steam Poster Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f0a1a;--bg2:#1a1230;--bg3:#241b3d;
      --text:#eaeaef;--hint:#8a82a6;
      --accent:#a855f7;--accent2:#7c3aed;--accent-soft:rgba(168,85,247,.12);
      --green:#4ade80;--red:#f87171;--yellow:#facc15;--blue:#60a5fa;
      --radius:14px;--radius-sm:10px;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro',sans-serif;font-size:15px;min-height:100vh;padding-bottom:80px;-webkit-tap-highlight-color:transparent}

    /* ── Header ── */
    .header{padding:20px 16px 12px;background:linear-gradient(135deg,#1a103a 0%,#2d1b69 50%,#1a103a 100%);border-bottom:1px solid rgba(168,85,247,.15)}
    .header-row{display:flex;align-items:center;gap:12px}
    .header-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
    .header-info{flex:1;min-width:0}
    .header-name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-meta{display:flex;align-items:center;gap:8px;margin-top:2px}
    .plan-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(124,58,237,.25));color:#c4b5fd;border:1px solid rgba(168,85,247,.2)}
    .header-bot-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
    .header-bot-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .header-bot-dot.online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.5)}
    .header-bot-dot.offline{background:#f87171}
    .refresh-indicator{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--hint);transition:opacity .3s}
    .refresh-indicator.updating{color:var(--accent);opacity:1}
    .refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 2s infinite}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── Tabs ── */
    .tabs{display:flex;padding:0 12px;gap:2px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(255,255,255,.05)}
    .tab{flex:1;padding:12px 0;font-size:13px;font-weight:600;text-align:center;color:var(--hint);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:all .2s;position:relative}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-icon{font-size:16px;display:block;margin-bottom:2px}

    /* ── Pages ── */
    .page{display:none;padding:14px 16px;animation:pageIn .25s ease}
    .page.active{display:block}
    @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* ── Cards ── */
    .card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04)}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .card-title{font-weight:700;font-size:15px}
    .card-sub{font-size:13px;color:var(--hint)}

    /* ── Badges ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .badge-green{background:rgba(34,197,94,.12);color:#4ade80}
    .badge-red{background:rgba(239,68,68,.12);color:#f87171}
    .badge-yellow{background:rgba(234,179,8,.12);color:#facc15}
    .badge-blue{background:rgba(96,165,250,.12);color:#60a5fa}
    .badge-purple{background:rgba(168,85,247,.12);color:#c4b5fd}
    .badge-gray{background:rgba(107,114,128,.12);color:#9ca3af}

    /* ── Stat grid ── */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
    .stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;border:1px solid rgba(255,255,255,.04)}
    .stat-icon{font-size:20px;margin-bottom:4px}
    .stat-val{font-size:22px;font-weight:800;background:linear-gradient(135deg,#c4b5fd,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .stat-lbl{font-size:11px;color:var(--hint);margin-top:2px}

    /* ── Quick actions ── */
    .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
    .action-btn:active{transform:scale(.96);background:var(--bg3)}
    .action-btn .action-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .action-icon-purple{background:rgba(168,85,247,.15);color:#a855f7}
    .action-icon-green{background:rgba(34,197,94,.15);color:#4ade80}
    .action-icon-blue{background:rgba(96,165,250,.15);color:#60a5fa}
    .action-icon-red{background:rgba(239,68,68,.15);color:#f87171}

    /* ── Bot status ── */
    .bot-status{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:14px}
    .bot-status.online{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15)}
    .bot-status.offline{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15)}
    .bot-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .bot-dot.online{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.5)}
    .bot-dot.offline{background:#f87171}
    .bot-info{flex:1}
    .bot-label{font-size:14px;font-weight:600}
    .bot-meta{font-size:12px;color:var(--hint)}

    /* ── Toggle switch ── */
    .toggle{position:relative;width:44px;height:24px;flex-shrink:0;background:rgba(255,255,255,.1);border-radius:12px;cursor:pointer;transition:background .2s;border:none;padding:0}
    .toggle.on{background:var(--accent)}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
    .toggle.on::after{transform:translateX(20px)}

    /* ── Rows ── */
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .row:last-child{border-bottom:none}

    /* ── Progress bar ── */
    .progress-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06);margin:8px 0}
    .progress-seg{height:100%;transition:width .3s}

    /* ── Job stats ── */
    .job-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
    .job-stat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500}
    .job-dot{width:8px;height:8px;border-radius:50%}

    /* ── Account card ── */
    .account-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04)}
    .account-row{display:flex;align-items:center;gap:12px}
    .account-avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent-soft),rgba(124,58,237,.15));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .account-info{flex:1;min-width:0}
    .account-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .account-url{font-size:12px;color:var(--accent);text-decoration:none}

    /* ── Campaign card ── */
    .campaign-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04)}
    .campaign-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .campaign-info{flex:1;min-width:0}
    .campaign-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .campaign-tpl{font-size:12px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .campaign-details{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--hint)}
    .campaign-details dt{color:var(--hint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
    .campaign-details dt:first-child{margin-top:0}
    .campaign-details dd{color:var(--text);margin-top:2px;word-break:break-word}
    .campaign-btns{display:flex;gap:6px;flex-shrink:0}

    /* ── Skeleton ── */
    .skeleton{border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-stat{height:80px;border-radius:var(--radius-sm)}
    .sk-card{height:72px}

    /* ── Buttons ── */
    .btn{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:all .15s}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn-sm{padding:8px 16px;font-size:13px;width:auto;margin:0}
    .btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
    .btn-ghost:active{background:rgba(255,255,255,.1)}
    .btn-icon{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
    .btn-icon:active{background:rgba(255,255,255,.1);transform:scale(.95)}
    .btn-icon.danger:active{background:rgba(239,68,68,.15);color:var(--red)}

    /* ── Forms ── */
    .input{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
    .input:focus{border-color:var(--accent)}
    .input::placeholder{color:rgba(138,130,166,.5)}
    textarea.input{resize:vertical;min-height:60px;font-family:monospace;font-size:13px;line-height:1.5}
    .label{display:block;font-size:12px;font-weight:600;color:var(--hint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
    .form-group{margin-bottom:14px}

    /* ── Toast ── */
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid rgba(168,85,247,.2);color:white;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:500;z-index:999;animation:toastIn .3s cubic-bezier(.2,1,.3,1);box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:90vw}
    .toast-icon{font-size:16px;flex-shrink:0}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

    /* ── Empty ── */
    .empty{text-align:center;padding:40px 20px;color:var(--hint)}
    .empty-icon{font-size:44px;margin-bottom:10px;opacity:.6}
    .empty-title{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text)}
    .empty-text{font-size:13px}

    /* ── Error banner ── */
    .error-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);font-size:13px;color:#fca5a5;margin-bottom:10px}

    /* ── Section ── */
    .section-title{font-size:13px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-left:2px}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

    /* ── Modal ── */
    .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:0;animation:slideUp .3s cubic-bezier(.2,1,.3,1)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;background:var(--bg);z-index:2}
    .modal-title{font-size:16px;font-weight:700}
    .modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
    .modal-body{padding:16px}

    /* ── Chips ── */
    .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--hint);transition:all .15s}
    .chip.selected{background:var(--accent-soft);color:var(--accent);border-color:rgba(168,85,247,.3)}
    .chip:active{transform:scale(.96)}

    /* ── Time chips ── */
    .time-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:600;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:#c4b5fd}
    .time-chip-remove{cursor:pointer;opacity:.6;font-size:14px}
    .time-chip-remove:active{opacity:1}

    /* ── Game grid ── */
    .game-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
    .game-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid rgba(255,255,255,.04);cursor:pointer;color:var(--text);font-size:11px;font-weight:600;text-align:center;transition:all .15s}
    .game-btn:active{transform:scale(.96);border-color:rgba(168,85,247,.3)}
    .game-emoji{font-size:22px}
    .forum-btn{text-align:left;padding:10px 14px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid rgba(255,255,255,.04);cursor:pointer;color:var(--text);font-size:13px;font-weight:600;margin-bottom:6px;transition:all .15s}
    .forum-btn:active{transform:scale(.96);border-color:rgba(168,85,247,.3)}
    .forum-btn-sub{font-size:11px;color:var(--hint);margin-top:2px;font-weight:400}

    /* ── Filter bar ── */
    .filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
    .filter-bar::-webkit-scrollbar{display:none}
    .filter-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);color:var(--hint);transition:all .15s;flex-shrink:0}
    .filter-chip.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(168,85,247,.3)}
    .filter-chip:active{transform:scale(.96)}

    /* ── Pagination ── */
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;padding:8px 0}
    .page-btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);color:var(--hint);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
    .page-btn:active{transform:scale(.96)}
    .page-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
    .page-info{font-size:12px;color:var(--hint)}

    /* ── QR box ── */
    .qr-box{background:#fff;border-radius:16px;padding:12px;margin:12px auto;max-width:250px}
    .qr-box img{width:100%;image-rendering:pixelated}

    /* ── Loading spinner ── */
    .spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner-lg{width:40px;height:40px;border-width:3px}
    .loading-center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0}

    /* ── Selected forum display ── */
    .selected-forum{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2)}
    .selected-forum-info{flex:1;min-width:0}
    .selected-forum-name{font-size:13px;font-weight:600}
    .selected-forum-url{font-size:11px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Var buttons ── */
    .var-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
    .var-btn{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);color:var(--hint);cursor:pointer;font-family:monospace;transition:all .15s}
    .var-btn:active{background:var(--accent-soft);color:var(--accent)}

    /* ── Info banner ── */
    .info-banner{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.15);font-size:12px;color:#93c5fd;margin-bottom:12px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="header-logo">SP</div>
    <div class="header-info">
      <div class="header-name" id="user-name">Загрузка...</div>
      <div class="header-meta">
        <span class="plan-badge" id="plan-badge">⏳ ...</span>
        <span class="header-bot-status" id="header-bot-status"></span>
        <span class="refresh-indicator" id="refresh-indicator"><div class="refresh-dot"></div></span>
      </div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-page="overview"><span class="tab-icon">📊</span>Обзор</button>
  <button class="tab" data-page="campaigns"><span class="tab-icon">📢</span>Кампании</button>
  <button class="tab" data-page="accounts"><span class="tab-icon">👤</span>Аккаунты</button>
  <button class="tab" data-page="jobs"><span class="tab-icon">📋</span>Задания</button>
</div>

<!-- ═══════════════ OVERVIEW ═══════════════ -->
<div id="page-overview" class="page active">
  <div id="overview-skeleton">
    <div class="stat-grid"><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div></div>
    <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
  </div>
  <div id="overview-content" style="display:none">
    <div id="bot-status-card"></div>
    <div id="error-alert"></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-val" id="stat-accounts">–</div><div class="stat-lbl">Аккаунты</div></div>
      <div class="stat-card"><div class="stat-icon">📢</div><div class="stat-val" id="stat-campaigns">–</div><div class="stat-lbl">Кампании</div></div>
      <div class="stat-card"><div class="stat-icon">📤</div><div class="stat-val" id="stat-jobs-today">–</div><div class="stat-lbl">Сегодня</div></div>
    </div>
    <div class="section-title">Быстрые действия</div>
    <div class="actions-grid">
      <button class="action-btn" onclick="botAction('start')"><div class="action-icon action-icon-green">▶</div>Запустить бота</button>
      <button class="action-btn" onclick="botAction('stop')"><div class="action-icon action-icon-red">⏹</div>Остановить бота</button>
      <button class="action-btn" onclick="refreshAll()"><div class="action-icon action-icon-blue">🔄</div>Обновить</button>
      <button class="action-btn" onclick="showPage('campaigns')"><div class="action-icon action-icon-purple">📢</div>Кампании</button>
    </div>
    <div class="section-title">Последние задания</div>
    <div class="card"><div id="recent-jobs"></div></div>
  </div>
</div>

/* ══════════════════════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════════════════════ */
function haptic(t='light'){try{tg?.HapticFeedback?.impactOccurred?.(t)}catch{}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function show(id){const e=document.getElementById(id);if(e)e.style.display=''}
function hide(id){const e=document.getElementById(id);if(e)e.style.display='none'}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function setHtml(id,v){const e=document.getElementById(id);if(e)e.innerHTML=v}
function isToday(d){return new Date(d).toDateString()===new Date().toDateString()}
function fmtTime(d){return new Date(d).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}

function showToast(msg,icon='ℹ️'){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span class="toast-icon">${icon}</span><span>${esc(msg)}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s'},2500);
  setTimeout(()=>el.remove(),2800);
}

/* ── API ── */
async function api(path,opts={}){
  const sep=path.includes('?')?'&':'?';
  const url=BASE+'/api'+path+sep+'_t='+Date.now();
  const res=await fetch(url,{
    cache:'no-store',
    headers:{'Content-Type':'application/json','Cache-Control':'no-cache',...(token?{Authorization:'Bearer '+token}:{})},
    ...opts, body:opts.body?JSON.stringify(opts.body):undefined,
  });
  if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||res.statusText)}
  return res.json();
}

async function authInit(){
  const initData=tg?.initData;
  if(!initData){
    document.getElementById('user-name').textContent='⚠️ Откройте через Telegram';
    document.getElementById('plan-badge').textContent='';
    return false;
  }
  try{
    const data=await api('/bot/miniapp/auth',{method:'POST',body:{init_data:initData}});
    token=data.access_token; me=data.user; subData=data.subscription;
    const name=me.name||me.email?.split('@')[0]||'Пользователь';
    document.getElementById('user-name').textContent=`Привет, ${name}!`;
    document.getElementById('plan-badge').textContent='✨ '+(subData?.plan_name||'Free');
    return true;
  }catch(e){
    document.getElementById('user-name').textContent='⚠️ Ошибка авторизации';
    document.getElementById('plan-badge').textContent='';
    return false;
  }
}

function showPage(name){

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector(`.tab[data-page="${name}"]`)?.classList.add('active');

}

function loadPage(name,silent=false){
  if(!token)return;
  const loaders={overview:loadOverview,campaigns:loadCampaigns,accounts:loadAccounts,jobs:loadJobs};
  loaders[name]?.(silent);
}

function flashRefreshIndicator(){
  const el=document.getElementById('refresh-indicator');
  if(!el)return;el.classList.add('updating');
  setTimeout(()=>el.classList.remove('updating'),1500);
}
function updateHeaderBotStatus(s){
  const el=document.getElementById('header-bot-status');if(!el)return;
  if(s&&s.running===true){el.innerHTML='<span class="header-bot-dot online"></span> Бот активен';el.style.color='var(--green)'}
  else{el.innerHTML='<span class="header-bot-dot offline"></span> Бот остановлен';el.style.color='var(--red)'}
}

async function loadOverview(silent=false){
  if(!silent){show('overview-skeleton');hide('overview-content')}
  flashRefreshIndicator();
  try{
    const [profiles,campaigns,jobsData,botStatus]=await Promise.all([
      api('/profiles'),api('/campaigns'),api('/jobs?limit=5'),api('/bot/status').catch(()=>null)
    ]);
    _profiles=profiles; _campaigns=campaigns;
    const jobs=jobsData.jobs||[];
    const today=jobs.filter(j=>isToday(j.scheduled_at||j.created_at)).length;
    setText('stat-accounts',profiles.length);
    setText('stat-campaigns',campaigns.length);
    setText('stat-jobs-today',today);
    updateHeaderBotStatus(botStatus);

    const bs=document.getElementById('bot-status-card');
    if(botStatus){
      const on=botStatus.running===true;
      bs.innerHTML=`<div class="bot-status ${on?'online':'offline'}"><div class="bot-dot ${on?'online':'offline'}"></div><div class="bot-info"><div class="bot-label">Steam бот ${on?'активен':'остановлен'}</div><div class="bot-meta">${on?'Работает нормально':'Нажмите "Запустить" для старта'}</div></div><button class="btn-ghost" onclick="botAction('${on?'stop':'start'}')">${on?'⏹ Стоп':'▶ Старт'}</button></div>`;
    }else{bs.innerHTML=''}

    const ea=document.getElementById('error-alert');
    const failedJobs=jobs.filter(j=>j.status==='failed');
    ea.innerHTML=failedJobs.length?`<div class="error-banner">⚠️ ${failedJobs.length} заданий завершились с ошибкой</div>`:'';

    const rj=document.getElementById('recent-jobs');
    rj.innerHTML=jobs.length===0?'<div class="empty" style="padding:20px 0"><div class="empty-text">Заданий пока нет</div></div>':jobs.map(jobRow).join('');
    hide('overview-skeleton');show('overview-content');
  }catch(e){showToast('Ошибка: '+e.message,'❌');hide('overview-skeleton')}
}

async function botAction(action){
  haptic('medium');
  try{
    showToast(action==='start'?'Запуск бота...':'Остановка бота...','⏳');
    await api('/bot/'+action,{method:'POST'});
    showToast(action==='start'?'Бот запущен!':'Бот остановлен',action==='start'?'✅':'⏹');
    updateHeaderBotStatus({running:action==='start'});
    setTimeout(()=>loadOverview(true),1000);
  }catch(e){showToast('Ошибка: '+e.message,'❌');haptic('error')}
}

    _profiles=await api('/profiles');
    renderAccounts();
    hide('accounts-skeleton');show('accounts-content');
  }catch(e){showToast('Ошибка: '+e.message,'❌');hide('accounts-skeleton')}
}

function renderAccounts(){
  const el=document.getElementById('accounts-list');
  if(!_profiles.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">👤</div><div class="empty-title">Аккаунтов нет</div><div class="empty-text">Добавьте Steam аккаунт</div><button class="btn" style="width:auto;margin:16px auto 0;display:block" onclick="openAddAccount()">＋ Добавить аккаунт</button></div>`;
    return;
  }
  el.innerHTML=_profiles.map(p=>{
    const active=p.is_active;
    const statusBadge=active?'<span class="badge badge-green">Активен</span>':'<span class="badge badge-red">Невалид</span>';
    return `
    <div class="account-card">
      <div class="account-row">
        <div class="account-avatar">🎮</div>
        <div class="account-info">
          <div class="account-name">${esc(p.name)}</div>
          ${p.target_url?`<a class="account-url" href="${esc(p.target_url)}" target="_blank">Профиль ↗</a>`:'<span class="card-sub">URL не указан</span>'}
        </div>
        ${statusBadge}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end">
        <button class="btn-icon" onclick="checkAccount('${p.id}')" title="Проверить сессию">🔍</button>
        <button class="btn-icon" onclick="toggleAccount('${p.id}',${!active})" title="${active?'Отключить':'Включить'}">${active?'⏸':'▶'}</button>
        <button class="btn-icon danger" onclick="deleteAccount('${p.id}','${esc(p.name)}')" title="Удалить">🗑</button>
      </div>
    </div>`;
  }).join('');
}

async function checkAccount(id){
  haptic('light');showToast('Проверяю сессию...','🔍');
  try{
    const data=await api('/profiles/'+id+'/check',{method:'POST'});
    if(data.valid){showToast('Сессия активна!','✅')}
    else{showToast('Сессия недействительна'+(data.reason?': '+data.reason:''),'❌')}
    loadAccounts(true);
  }catch(e){showToast('Ошибка: '+e.message,'❌')}
}

async function toggleAccount(id,active){
  haptic('medium');
  try{
    await api('/profiles/'+id+'/toggle',{method:'POST'});
    showToast(active?'Аккаунт включён':'Аккаунт отключён',active?'✅':'⏸');
    loadAccounts(true);
  }catch(e){showToast('Ошибка: '+e.message,'❌')}
}

async function deleteAccount(id,name){
  haptic('medium');
  openModal('Удалить аккаунт?',`
    <p style="color:var(--hint);margin-bottom:16px">Вы уверены, что хотите удалить аккаунт <strong style="color:var(--text)">${name}</strong>?</p>

      <button class="btn" style="flex:1;background:linear-gradient(135deg,#ef4444,#dc2626)" onclick="confirmDeleteAccount('${id}')">Удалить</button>

}

async function confirmDeleteAccount(id){

    await api('/profiles/'+id,{method:'DELETE'});
    showToast('Аккаунт удалён','✅');

/* ── Add Account (Login Flow) ── */
let _loginSessionId=null, _loginPollTimer=null, _qrPollTimer=null, _loginMode='qr';

function openAddAccount(){
  _loginSessionId=null; _loginMode='qr';
  openModal('Добавить аккаунт',`
    <div class="form-group">
      <label class="label">Название аккаунта *</label>
      <input class="input" id="login-name" placeholder="my_steam_account" />
    </div>
    <div class="form-group">
      <label class="label">URL форума <span style="color:var(--hint);font-weight:400">(необязательно)</span></label>
      <input class="input" id="login-url" placeholder="https://steamcommunity.com/app/..." />
    </div>
    <div class="form-group">
      <label class="label">Способ входа</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button type="button" class="chip selected" id="mode-qr" onclick="selectLoginMode('qr')">📱 QR-код</button>
        <button type="button" class="chip" id="mode-credentials" onclick="selectLoginMode('credentials')">🔑 Логин/Пароль</button>
      </div>
    </div>
    <div class="info-banner" id="login-info">📱 Для QR-кода откройте Steam на <strong>другом устройстве</strong> → Настройки → Войти через QR</div>
    <button class="btn" onclick="startLogin()">Продолжить</button>
  `);
}

function selectLoginMode(mode){
  _loginMode=mode;
  document.getElementById('mode-qr')?.classList.toggle('selected',mode==='qr');
  document.getElementById('mode-credentials')?.classList.toggle('selected',mode==='credentials');
  const info=document.getElementById('login-info');
  if(info){
    info.innerHTML=mode==='qr'
      ?'📱 Для QR-кода откройте Steam на <strong>другом устройстве</strong> → Настройки → Войти через QR'
      :'🔑 Данные будут введены в браузер на сервере — они не сохраняются';
  }
}

async function startLogin(){
  const name=document.getElementById('login-name')?.value?.trim();
  if(!name){showToast('Введите имя аккаунта','⚠️');return}
  const targetUrl=document.getElementById('login-url')?.value?.trim()||undefined;
  setModalBody('<div class="loading-center"><div class="spinner spinner-lg"></div><p style="color:var(--hint)">Запускаем браузер…</p></div>');
  try{
    const data=await api('/profiles/login/start',{method:'POST',body:{name,target_url:targetUrl,mode:_loginMode}});
    _loginSessionId=data.sessionId;
    startStatusPoll(_loginSessionId);
    if(_loginMode==='qr'){startQRPoll(_loginSessionId)}
    else{showCredentialsForm()}
  }catch(e){setModalBody(`<div class="error-banner">❌ ${esc(e.message)}</div><button class="btn" onclick="openAddAccount()">Попробовать снова</button>`)}
}

function startStatusPoll(sid){
  _loginPollTimer=setInterval(async()=>{
    try{
      const data=await api('/profiles/login/'+sid+'/status');
      if(data.status==='done'){
        clearInterval(_loginPollTimer);_loginPollTimer=null;
        clearInterval(_qrPollTimer);_qrPollTimer=null;
        _loginSessionId=null;
        setModalBody('<div class="loading-center"><div style="font-size:48px">✅</div><p style="color:var(--green);font-weight:700;font-size:16px">Аккаунт добавлен!</p></div>');
        showToast('Аккаунт Steam добавлен!','✅');
        setTimeout(()=>{closeModal();loadAccounts(true)},1500);
      }else if(['expired','cancelled'].includes(data.status)){
        clearInterval(_loginPollTimer);_loginPollTimer=null;
        clearInterval(_qrPollTimer);_qrPollTimer=null;
        setModalBody('<div class="error-banner">⏰ Сессия истекла</div><button class="btn" onclick="openAddAccount()">Попробовать снова</button>');
      }else if(data.status==='error'){
        clearInterval(_loginPollTimer);_loginPollTimer=null;
        clearInterval(_qrPollTimer);_qrPollTimer=null;
        setModalBody(`<div class="error-banner">❌ ${esc(data.error||'Ошибка при входе')}</div><button class="btn" onclick="openAddAccount()">Попробовать снова</button>`);
      }else if(data.status==='waiting_guard'||data.status==='waiting_mobile_confirm'){
        clearInterval(_qrPollTimer);_qrPollTimer=null;
        showGuardForm();
      }
    }catch{}
  },2500);
}

function startQRPoll(sid){
  _qrPollTimer=setInterval(async()=>{
    try{
      const data=await api('/profiles/login/'+sid+'/qr');
      if(data.qr){showQRCode(data.qr)}
    }catch{}
  },2200);
}

function showQRCode(qrBase64){
  if(document.getElementById('qr-img')){
    document.getElementById('qr-img').src='data:image/png;base64,'+qrBase64;
    return;
  }
  setModalBody(`
    <p style="text-align:center;color:var(--hint);font-size:13px;margin-bottom:8px">Откройте <strong style="color:var(--text)">Steam</strong> на другом устройстве:<br><span style="color:var(--hint)">Настройки → Войти через QR-код</span></p>
    <div class="qr-box"><img id="qr-img" src="data:image/png;base64,${qrBase64}" alt="QR" /></div>
    <p style="text-align:center;font-size:12px;color:var(--hint)"><span class="spinner" style="width:14px;height:14px;vertical-align:middle;margin-right:6px"></span>Ожидаем сканирования…</p>
  `);
}

function showCredentialsForm(){
  setModalBody(`
    <div class="info-banner">🖥 Сервер готов. Введите данные — они будут переданы браузеру.</div>
    <div class="form-group">
      <label class="label">Логин Steam</label>
      <input class="input" id="cred-username" placeholder="username" autocomplete="username" />
    </div>
    <div class="form-group">
      <label class="label">Пароль</label>
      <input class="input" id="cred-password" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="cred-submit-btn" onclick="submitCredentials()">Войти</button>

async function submitCredentials(){
  const username=document.getElementById('cred-username')?.value?.trim();
  const password=document.getElementById('cred-password')?.value;
  if(!username||!password){showToast('Введите логин и пароль','⚠️');return}
  const btn=document.getElementById('cred-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Входим...'}
  try{
    const data=await api('/profiles/login/'+_loginSessionId+'/credentials',{method:'POST',body:{username,password}});
    if(data.needsGuard||data.needsMobileConfirm){showGuardForm()}
  }catch(e){
    showToast(e.message||'Ошибка входа','❌');
    if(btn){btn.disabled=false;btn.textContent='Войти'}
  }
}

function showGuardForm(){
  if(document.getElementById('guard-input'))return;
  setModalBody(`
    <div style="text-align:center;margin-bottom:12px">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(96,165,250,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:28px">🛡</div>
      <p style="font-weight:700;font-size:15px">Подтвердите вход</p>
      <p style="font-size:12px;color:var(--hint);margin-top:4px">Введите код с <strong style="color:var(--text)">почты</strong> / из <strong style="color:var(--text)">Steam Guard</strong><br>или подтвердите в <strong style="color:var(--text)">мобильном приложении</strong></p>
    </div>
    <input class="input" id="guard-input" placeholder="XXXXX" maxlength="8" style="text-align:center;font-size:22px;font-family:monospace;letter-spacing:4px" />
    <button class="btn" id="guard-submit-btn" onclick="submitGuard()" style="margin-top:10px">Отправить код</button>

  `);
  setTimeout(()=>{
    const gi=document.getElementById('guard-input');

  },100);
}

async function submitGuard(){
  const code=document.getElementById('guard-input')?.value?.trim();
  if(!code){showToast('Введите код','⚠️');return}
  const btn=document.getElementById('guard-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Проверяю...'}
  try{
    await api('/profiles/login/'+_loginSessionId+'/guard',{method:'POST',body:{code}});
  }catch(e){
    showToast(e.message||'Неверный код','❌');
    if(btn){btn.disabled=false;btn.textContent='Отправить код'}
  }
}

async function loadCampaigns(silent=false){
  if(!silent){show('campaigns-skeleton');hide('campaigns-content')}
  flashRefreshIndicator();
  try{
    [_campaigns,_profiles]=await Promise.all([api('/campaigns'),api('/profiles')]);
    renderCampaigns();
    hide('campaigns-skeleton');show('campaigns-content');
  }catch(e){showToast('Ошибка: '+e.message,'❌');hide('campaigns-skeleton')}
}

function renderCampaigns(){
  const el=document.getElementById('campaigns-list');

    const scheduleLabel=times.length?times.join(', '):(c.schedule_minutes?`Каждые ${c.schedule_minutes} мин.`:'Не задано');
    const game=STEAM_GAMES.find(g=>g.forums.some(f=>f.url===c.target_url));

          <div class="campaign-tpl">${esc(c.title_template||'—')}</div>
        </div>
        <span class="badge ${c.is_active?'badge-green':'badge-gray'}">${c.is_active?'Активна':'Пауза'}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <div style="font-size:12px;color:var(--hint)">⏰ ${esc(scheduleLabel)}${forumInfo?' · '+forumInfo:''}</div>
        <div class="campaign-btns">
          <button class="btn-icon" onclick="toggleCampaign('${c.id}',${!c.is_active})" title="${c.is_active?'Пауза':'Запустить'}">${c.is_active?'⏸':'▶'}</button>
          <button class="btn-icon" onclick="expandCampaign('${c.id}')" title="Подробнее">📋</button>
          <button class="btn-icon" onclick="openCampaignForm('${c.id}')" title="Редактировать">✏️</button>
          <button class="btn-icon danger" onclick="deleteCampaign('${c.id}','${esc(c.name)}')" title="Удалить">🗑</button>
        </div>
      </div>
      <div class="campaign-details" id="camp-details-${c.id}" style="display:none">
        <dt>Заголовок</dt><dd>${esc(c.title_template)}</dd>
        <dt>Тело</dt><dd style="white-space:pre-wrap;max-height:120px;overflow-y:auto">${esc(c.body_template||'—')}</dd>
        <dt>Расписание</dt><dd>${esc(scheduleLabel)}</dd>
        ${c.window_start&&c.window_end?`<dt>Окно</dt><dd>${esc(c.window_start)} – ${esc(c.window_end)}</dd>`:''}
        ${c.target_url?`<dt>Форум</dt><dd style="word-break:break-all">${esc(c.target_url)}</dd>`:''}
        ${c.profile_ids?.length?`<dt>Аккаунты</dt><dd>${c.profile_ids.map(pid=>{const p=_profiles.find(x=>x.id===pid);return p?esc(p.name):pid}).join(', ')}</dd>`:''}

function expandCampaign(id){
  haptic('light');
  const el=document.getElementById('camp-details-'+id);

}

async function toggleCampaign(id,active){
  haptic('medium');
  try{
    await api('/campaigns/'+id,{method:'PATCH',body:{is_active:active}});

async function deleteCampaign(id,name){

/* ── Campaign Form (Create / Edit) ── */
let _editingCampaign=null, _formForumUrl='', _formTimes=[], _formProfileIds=[];

function openCampaignForm(campaignId){
  if(campaignId){_editingCampaign=_campaigns.find(c=>c.id===campaignId)||null}
  else{_editingCampaign=null}
  const c=_editingCampaign;
  _formForumUrl=c?.target_url||'';
  _formTimes=parseTimes(c?.schedule_times)||[];
  _formProfileIds=c?.profile_ids?[...c.profile_ids]:[];

  openModal(c?'Редактировать кампанию':'Новая кампания',buildCampaignFormHtml(c));
}

function buildCampaignFormHtml(c){

    const sel=_formProfileIds.includes(p.id);
    return `<button type="button" class="chip ${sel?'selected':''}" onclick="toggleFormProfile('${p.id}',this)">${esc(p.name)}</button>`;

  const varBtns=TEMPLATE_VARS.map(v=>`<button type="button" class="var-btn" onclick="insertVarTo('form-title','${v.v}')" title="${v.h}">${v.v}</button>`).join('');
  const varBtnsBody=TEMPLATE_VARS.map(v=>`<button type="button" class="var-btn" onclick="insertVarTo('form-body','${v.v}')" title="${v.h}">${v.v}</button>`).join('');

  return `
    <form onsubmit="submitCampaignForm(event)">
      <div class="form-group">
        <label class="label">Раздел форума Steam</label>
        <div id="forum-picker-container">${forumHtml}</div>
      </div>
      <div class="form-group">
        <label class="label">Название кампании *</label>
        <input class="input" id="form-name" required value="${esc(c?.name||'')}" placeholder="Моя кампания" />
      </div>
      <div class="form-group">
        <label class="label">Шаблон заголовка *</label>
        <input class="input" id="form-title" required value="${esc(c?.title_template||'')}" placeholder="{full_inventory_post}" style="font-family:monospace;font-size:13px" />
        <div class="var-row">${varBtns}</div>
      </div>
      <div class="form-group">
        <label class="label">Тело публикации *</label>
        <textarea class="input" id="form-body" rows="4" required placeholder="Напр.: {full_inventory_post}">${esc(c?.body_template||'')}</textarea>
        <div class="var-row">${varBtnsBody}</div>
      </div>
      <div class="form-group">
        <label class="label">Время публикаций * <span style="color:var(--hint);font-weight:400">(мин. 60 мин. между)</span></label>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input type="time" class="input" id="form-time-input" style="width:130px" />
          <button type="button" class="btn-sm btn" onclick="addFormTime()">＋</button>
        </div>
        <div id="form-times-list" style="display:flex;flex-wrap:wrap;gap:6px">${timesHtml}</div>
      </div>
      <div class="form-group">
        <label class="label">Окно активности <span style="color:var(--hint);font-weight:400">(необязательно)</span></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="time" class="input" id="form-window-start" style="width:120px" value="${esc(c?.window_start||'')}" />
          <span style="color:var(--hint)">–</span>
          <input type="time" class="input" id="form-window-end" style="width:120px" value="${esc(c?.window_end||'')}" />
        </div>
      </div>
      <div class="form-group">
        <label class="label">Аккаунты * <span style="color:var(--hint);font-weight:400">(${_formProfileIds.length} выбрано)</span></label>
        ${_profiles.length?`<div style="display:flex;flex-wrap:wrap;gap:6px" id="form-profiles">${profileChips}</div>`:'<p style="font-size:13px;color:var(--hint)">Сначала добавьте аккаунты</p>'}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="button" class="btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
        <button type="submit" class="btn" style="flex:1;margin:0" id="campaign-submit-btn">${c?'Сохранить':'Создать'}</button>
      </div>

}

function insertVarTo(fieldId,varStr){
  const el=document.getElementById(fieldId);if(!el)return;
  const start=el.selectionStart,end=el.selectionEnd,val=el.value;
  el.value=val.slice(0,start)+varStr+val.slice(end);
  el.focus();el.setSelectionRange(start+varStr.length,start+varStr.length);
}

function toggleFormProfile(id,btn){
  haptic('light');
  const idx=_formProfileIds.indexOf(id);
  if(idx>=0){_formProfileIds.splice(idx,1);btn.classList.remove('selected')}
  else{_formProfileIds.push(id);btn.classList.add('selected')}
}

function addFormTime(){
  const input=document.getElementById('form-time-input');
  const t=input?.value;if(!t)return;
  if(_formTimes.includes(t)){showToast('Это время уже добавлено','⚠️');return}
  const next=[..._formTimes,t].sort();
  if(!validateTimes(next)){showToast('Мин. 60 минут между публикациями','⚠️');return}
  _formTimes=next;input.value='';renderFormTimes();
}
function removeFormTime(t){_formTimes=_formTimes.filter(x=>x!==t);renderFormTimes()}
function renderFormTimes(){
  const el=document.getElementById('form-times-list');
  if(el)el.innerHTML=_formTimes.map(t=>`<span class="time-chip">${t} <span class="time-chip-remove" onclick="removeFormTime('${t}')">✕</span></span>`).join('');
}
function validateTimes(times){
  if(times.length<2)return true;
  const mins=times.map(t=>{const[h,m]=t.split(':').map(Number);return h*60+m}).sort((a,b)=>a-b);
  for(let i=1;i<mins.length;i++){if(mins[i]-mins[i-1]<60)return false}
  return(1440-mins[mins.length-1]+mins[0])>=60;
}

/* ── Submit Campaign Form ── */
async function submitCampaignForm(e){
  e.preventDefault();
  const name=document.getElementById('form-name')?.value?.trim();
  const title_template=document.getElementById('form-title')?.value?.trim();
  const body_template=document.getElementById('form-body')?.value?.trim();
  const window_start=document.getElementById('form-window-start')?.value||null;
  const window_end=document.getElementById('form-window-end')?.value||null;

  if(!name||!title_template||!body_template){showToast('Заполните все обязательные поля','⚠️');return}
  if(!_formProfileIds.length){showToast('Выберите хотя бы один аккаунт','⚠️');return}
  if(!_formTimes.length){showToast('Добавьте хотя бы одно время публикации','⚠️');return}

  const btn=document.getElementById('campaign-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Сохраняю...'}

  const payload={name,title_template,body_template,schedule_times:_formTimes,window_start,window_end,profile_ids:_formProfileIds,target_url:_formForumUrl||null};

  try{
    if(_editingCampaign){
      await api('/campaigns/'+_editingCampaign.id,{method:'PATCH',body:payload});
      showToast('Кампания обновлена','✅');
    }else{
      await api('/campaigns',{method:'POST',body:payload});
      showToast('Кампания создана','✅');
    }
    closeModal();loadCampaigns(true);
  }catch(e){
    showToast('Ошибка: '+e.message,'❌');
    if(btn){btn.disabled=false;btn.textContent=_editingCampaign?'Сохранить':'Создать'}
  }
}

   JOBS
   ══════════════════════════════════════════════════════════════ */
async function loadJobs(silent=false){
  if(!silent){show('jobs-skeleton');hide('jobs-content')}
  flashRefreshIndicator();
  try{
    const statusParam=_jobsFilter!=='all'?`&status=${_jobsFilter}`:'';
    const {jobs,total}=await api(`/jobs?limit=${JOBS_LIMIT}&offset=${_jobsOffset}${statusParam}`);
    const stats=await api('/jobs/stats').catch(()=>({pending:0,running:0,done:0,failed:0,today:0}));

    // Filter bar
    setHtml('jobs-filter-bar',`
      <div class="filter-bar">
        ${[['all','Все'],['pending','⏳ Ждёт'],['running','🔄 Идёт'],['done','✅ Готово'],['failed','❌ Ошибка'],['cancelled','⛔ Отмена']].map(([v,l])=>
          `<button class="filter-chip ${_jobsFilter===v?'active':''}" onclick="setJobsFilter('${v}')">${l}</button>`
        ).join('')}
      </div>
    `);

    // Stats bar
    const tot=(stats.pending||0)+(stats.running||0)+(stats.done||0)+(stats.failed||0)+(stats.cancelled||0)||1;
    setHtml('jobs-stats-bar',`
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><span class="card-title">Статистика</span><span class="card-sub">Всего: ${total} · Сегодня: ${stats.today||0}</span></div>
        <div class="progress-bar">
          <div class="progress-seg" style="width:${(stats.done||0)/tot*100}%;background:var(--green)"></div>
          <div class="progress-seg" style="width:${(stats.running||0)/tot*100}%;background:var(--blue)"></div>
          <div class="progress-seg" style="width:${(stats.pending||0)/tot*100}%;background:var(--yellow)"></div>
          <div class="progress-seg" style="width:${(stats.failed||0)/tot*100}%;background:var(--red)"></div>
        </div>
        <div class="job-stats">
          <div class="job-stat"><div class="job-dot" style="background:var(--green)"></div>Готово ${stats.done||0}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--blue)"></div>Идёт ${stats.running||0}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--yellow)"></div>Ждёт ${stats.pending||0}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--red)"></div>Ошибка ${stats.failed||0}</div>
        </div>
      </div>
    `);

    // Jobs list
    if(!jobs?.length){
      setHtml('jobs-list',`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Заданий нет</div></div>`);
      setHtml('jobs-pagination','');
    }else{
      setHtml('jobs-list',jobs.map(jobRowFull).join(''));
      const totalPages=Math.ceil(total/JOBS_LIMIT);
      const currentPage=Math.floor(_jobsOffset/JOBS_LIMIT)+1;
      setHtml('jobs-pagination',totalPages>1?`
        <div class="pagination">
          <button class="page-btn" onclick="jobsPage(${_jobsOffset-JOBS_LIMIT})" ${_jobsOffset<=0?'disabled':''}>← Назад</button>
          <span class="page-info">${currentPage} / ${totalPages}</span>
          <button class="page-btn" onclick="jobsPage(${_jobsOffset+JOBS_LIMIT})" ${_jobsOffset+JOBS_LIMIT>=total?'disabled':''}>Вперёд →</button>
        </div>
      `:'');
    }
    hide('jobs-skeleton');show('jobs-content');
  }catch(e){showToast('Ошибка: '+e.message,'❌');hide('jobs-skeleton')}
}

function setJobsFilter(filter){haptic('light');_jobsFilter=filter;_jobsOffset=0;loadJobs(true)}
function jobsPage(offset){haptic('light');_jobsOffset=Math.max(0,offset);loadJobs(true)}

function jobRowFull(j){
  const cfg={done:{icon:'✅',label:'Готово',badge:'badge-green'},failed:{icon:'❌',label:'Ошибка',badge:'badge-red'},pending:{icon:'⏳',label:'Ждёт',badge:'badge-yellow'},running:{icon:'🔄',label:'Идёт',badge:'badge-blue'},cancelled:{icon:'⛔',label:'Отмена',badge:'badge-gray'}};
  const c=cfg[j.status]||{icon:'⏳',label:j.status,badge:'badge-gray'};
  const time=fmtTime(j.scheduled_at||j.created_at);
  const errText=j.error_message||j.error||'';
  const actions=[];
  if(j.status==='pending')actions.push(`<button class="btn-icon" onclick="cancelJob('${j.id}')" title="Отменить">⛔</button>`);
  if(['done','failed','cancelled'].includes(j.status))actions.push(`<button class="btn-icon danger" onclick="deleteJob('${j.id}')" title="Удалить">🗑</button>`);
  return `
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600">${c.icon} ${esc(j.campaign_name||'Кампания')}</div>
          <div style="font-size:12px;color:var(--hint);margin-top:1px">${esc(j.profile_name||'')} · ${time}</div>
          ${errText?`<div style="font-size:11px;color:var(--red);margin-top:3px;word-break:break-word">${esc(errText)}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${actions.join('')}
          <span class="badge ${c.badge}">${c.label}</span>
        </div>
      </div>
    </div>`;
}

async function cancelJob(id){haptic('medium');try{await api('/jobs/'+id+'/cancel',{method:'POST'});showToast('Задание отменено','⛔');loadJobs(true)}catch(e){showToast('Ошибка: '+e.message,'❌')}}
async function deleteJob(id){haptic('medium');try{await api('/jobs/'+id,{method:'DELETE'});showToast('Задание удалено','✅');loadJobs(true)}catch(e){showToast('Ошибка: '+e.message,'❌')}}

/* ── Overview job row (compact) ── */
function jobRow(j){
  const cfg={done:{icon:'✅',label:'Готово',badge:'badge-green'},failed:{icon:'❌',label:'Ошибка',badge:'badge-red'},pending:{icon:'⏳',label:'Ждёт',badge:'badge-yellow'},running:{icon:'🔄',label:'Идёт',badge:'badge-blue'}};
  const c=cfg[j.status]||{icon:'⏳',label:j.status,badge:'badge-gray'};
  const time=fmtTime(j.scheduled_at||j.created_at);
  const errText=j.error_message||j.error||'';
  return `<div class="row"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${c.icon} ${esc(j.campaign_name||'Кампания')}</div><div style="font-size:12px;color:var(--hint);margin-top:1px">${esc(j.profile_name||'')} · ${time}</div>${errText?`<div style="font-size:11px;color:var(--red);margin-top:3px;word-break:break-word">${esc(errText)}</div>`:''}</div><span class="badge ${c.badge}">${c.label}</span></div>`;
}

function parseTimes(raw){
  if(!raw)return[];
  if(Array.isArray(raw))return raw;
  try{const v=JSON.parse(raw);return Array.isArray(v)?v:[]}catch{return[]}
}

/* ══════════════════════════════════════════════════════════════
   AUTO-REFRESH
   ══════════════════════════════════════════════════════════════ */
function startAutoRefresh(){
  stopAutoRefresh();
  _autoRefreshTimer=setInterval(()=>{
    const ap=document.querySelector('.page.active')?.id?.replace('page-','');
    if(ap&&token)loadPage(ap,true);
  },AUTO_REFRESH_MS);
}
function stopAutoRefresh(){if(_autoRefreshTimer){clearInterval(_autoRefreshTimer);_autoRefreshTimer=null}}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopAutoRefresh()}
  else if(token){
    const ap=document.querySelector('.page.active')?.id?.replace('page-','');
    if(ap)loadPage(ap,true);
    startAutoRefresh();
  }
});

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async()=>{
  const ok=await authInit();
  if(ok){await loadOverview();startAutoRefresh()}
})();
</script>
