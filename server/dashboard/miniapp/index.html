<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Steam Poster Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f0a1a;
      --bg2:#1a1230;
      --bg3:#241b3d;
      --text:#eaeaef;
      --hint:#8a82a6;
      --accent:#a855f7;
      --accent2:#7c3aed;
      --accent-soft:rgba(168,85,247,.12);
      --green:#4ade80;
      --red:#f87171;
      --yellow:#facc15;
      --blue:#60a5fa;
      --radius:14px;
      --radius-sm:10px;
    }
    body{
      background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro',sans-serif;
      font-size:15px;min-height:100vh;padding-bottom:80px;
      -webkit-tap-highlight-color:transparent;
    }
    /* ── Header ─────────────────── */
    .header{
      padding:20px 16px 12px;
      background:linear-gradient(135deg,#1a103a 0%,#2d1b69 50%,#1a103a 100%);
      border-bottom:1px solid rgba(168,85,247,.15);
    }
    .header-row{display:flex;align-items:center;gap:12px}
    .header-logo{
      width:42px;height:42px;border-radius:12px;
      background:linear-gradient(135deg,#a855f7,#7c3aed);
      display:flex;align-items:center;justify-content:center;
      font-size:20px;font-weight:700;color:#fff;flex-shrink:0;
    }
    .header-info{flex:1;min-width:0}
    .header-name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-meta{display:flex;align-items:center;gap:8px;margin-top:2px}
    .plan-badge{
      display:inline-flex;align-items:center;gap:4px;
      padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;
      background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(124,58,237,.25));
      color:#c4b5fd;border:1px solid rgba(168,85,247,.2);
    }
    .header-status{font-size:12px;color:var(--hint)}

    /* ── Tabs ──────────────────── */
    .tabs{
      display:flex;padding:0 12px;gap:2px;
      background:var(--bg);position:sticky;top:0;z-index:10;
      border-bottom:1px solid rgba(255,255,255,.05);
    }
    .tab{
      flex:1;padding:12px 0;font-size:13px;font-weight:600;
      text-align:center;color:var(--hint);cursor:pointer;
      background:none;border:none;border-bottom:2px solid transparent;
      transition:all .2s;position:relative;
    }
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-icon{font-size:16px;display:block;margin-bottom:2px}

    /* ── Pages ─────────────────── */
    .page{display:none;padding:14px 16px;animation:pageIn .25s ease}
    .page.active{display:block}
    @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* ── Cards ─────────────────── */
    .card{
      background:var(--bg2);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:10px;
      border:1px solid rgba(255,255,255,.04);
    }
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .card-title{font-weight:700;font-size:15px}
    .card-sub{font-size:13px;color:var(--hint)}

    /* ── Badges ────────────────── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .badge-green{background:rgba(34,197,94,.12);color:#4ade80}
    .badge-red{background:rgba(239,68,68,.12);color:#f87171}
    .badge-yellow{background:rgba(234,179,8,.12);color:#facc15}
    .badge-blue{background:rgba(96,165,250,.12);color:#60a5fa}
    .badge-purple{background:rgba(168,85,247,.12);color:#c4b5fd}
    .badge-gray{background:rgba(107,114,128,.12);color:#9ca3af}

    /* ── Stat grid ─────────────── */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
    .stat-card{
      background:var(--bg2);border-radius:var(--radius-sm);padding:14px 10px;
      text-align:center;border:1px solid rgba(255,255,255,.04);
    }
    .stat-icon{font-size:20px;margin-bottom:4px}
    .stat-val{font-size:22px;font-weight:800;background:linear-gradient(135deg,#c4b5fd,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .stat-lbl{font-size:11px;color:var(--hint);margin-top:2px}

    /* ── Quick actions ─────────── */
    .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .action-btn{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:6px;padding:16px 8px;border-radius:var(--radius-sm);
      background:var(--bg2);border:1px solid rgba(255,255,255,.04);
      color:var(--text);cursor:pointer;font-size:12px;font-weight:600;
      transition:all .15s;
    }
    .action-btn:active{transform:scale(.96);background:var(--bg3)}
    .action-btn .action-icon{
      width:40px;height:40px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:18px;
    }
    .action-icon-purple{background:rgba(168,85,247,.15);color:#a855f7}
    .action-icon-green{background:rgba(34,197,94,.15);color:#4ade80}
    .action-icon-blue{background:rgba(96,165,250,.15);color:#60a5fa}
    .action-icon-red{background:rgba(239,68,68,.15);color:#f87171}

    /* ── Bot status ─────────────── */
    .bot-status{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;border-radius:var(--radius-sm);
      margin-bottom:14px;
    }
    .bot-status.online{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15)}
    .bot-status.offline{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15)}
    .bot-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .bot-dot.online{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.5)}
    .bot-dot.offline{background:#f87171}
    .bot-info{flex:1}
    .bot-label{font-size:14px;font-weight:600}
    .bot-meta{font-size:12px;color:var(--hint)}

    /* ── Toggle switch ─────────── */
    .toggle{
      position:relative;width:44px;height:24px;flex-shrink:0;
      background:rgba(255,255,255,.1);border-radius:12px;cursor:pointer;
      transition:background .2s;border:none;padding:0;
    }
    .toggle.on{background:var(--accent)}
    .toggle::after{
      content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
      border-radius:50%;background:#fff;transition:transform .2s;
    }
    .toggle.on::after{transform:translateX(20px)}

    /* ── Campaign card ────────── */
    .campaign-card{
      background:var(--bg2);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:10px;
      border:1px solid rgba(255,255,255,.04);
    }
    .campaign-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .campaign-info{flex:1;min-width:0}
    .campaign-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .campaign-tpl{font-size:12px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── Rows ──────────────────── */
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .row:last-child{border-bottom:none}

    /* ── Progress bar ──────────── */
    .progress-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06);margin:8px 0}
    .progress-seg{height:100%;transition:width .3s}

    /* ── Job stats ─────────────── */
    .job-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
    .job-stat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500}
    .job-dot{width:8px;height:8px;border-radius:50%}

    /* ── Account card ──────────── */
    .account-card{
      background:var(--bg2);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:10px;
      border:1px solid rgba(255,255,255,.04);
      display:flex;align-items:center;gap:12px;
    }
    .account-avatar{
      width:40px;height:40px;border-radius:10px;
      background:linear-gradient(135deg,var(--accent-soft),rgba(124,58,237,.15));
      display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;
    }
    .account-info{flex:1;min-width:0}
    .account-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .account-url{font-size:12px;color:var(--accent);text-decoration:none}

    /* ── Skeleton ──────────────── */
    .skeleton{border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-stat{height:80px;border-radius:var(--radius-sm)}
    .sk-card{height:72px}
    .sk-action{height:84px}

    /* ── Buttons ───────────────── */
    .btn{
      background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;
      border:none;border-radius:var(--radius-sm);padding:12px 20px;
      font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;
      transition:all .15s;
    }
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn-sm{padding:8px 16px;font-size:13px;width:auto;margin:0}
    .btn-ghost{
      background:rgba(255,255,255,.06);color:var(--text);
      border:1px solid rgba(255,255,255,.06);border-radius:8px;
      padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;
      transition:all .15s;
    }
    .btn-ghost:active{background:rgba(255,255,255,.1)}

    /* ── Toast ─────────────────── */
    .toast{
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:8px;
      background:var(--bg3);border:1px solid rgba(168,85,247,.2);
      color:white;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:500;
      z-index:999;animation:toastIn .3s cubic-bezier(.2,1,.3,1);
      box-shadow:0 8px 32px rgba(0,0,0,.4);
    }
    .toast-icon{font-size:16px}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

    /* ── Empty ─────────────────── */
    .empty{text-align:center;padding:40px 20px;color:var(--hint)}
    .empty-icon{font-size:44px;margin-bottom:10px;opacity:.6}
    .empty-title{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text)}
    .empty-text{font-size:13px}

    /* ── Error banner ──────────── */
    .error-banner{
      display:flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:var(--radius-sm);
      background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);
      font-size:13px;color:#fca5a5;margin-bottom:10px;
    }

    /* ── Section ───────────────── */
    .section-title{font-size:13px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-left:2px}

    /* ── Auto-refresh indicator ─── */
    .refresh-indicator{
      display:inline-flex;align-items:center;gap:4px;
      font-size:11px;color:var(--hint);transition:opacity .3s;
    }
    .refresh-indicator.updating{color:var(--accent);opacity:1}
    .refresh-dot{
      width:6px;height:6px;border-radius:50%;background:var(--green);
      animation:pulse-dot 2s infinite;
    }
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
    .header-bot-status{
      display:inline-flex;align-items:center;gap:5px;
      font-size:12px;font-weight:600;
    }
    .header-bot-dot{
      width:7px;height:7px;border-radius:50%;flex-shrink:0;
    }
    .header-bot-dot.online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.5)}
    .header-bot-dot.offline{background:#f87171}
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="header-logo">SP</div>
    <div class="header-info">
      <div class="header-name" id="user-name">Загрузка...</div>
      <div class="header-meta">
        <span class="plan-badge" id="plan-badge">⏳ ...</span>
        <span class="header-bot-status" id="header-bot-status"></span>
        <span class="refresh-indicator" id="refresh-indicator"><div class="refresh-dot"></div></span>
      </div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-page="overview"><span class="tab-icon">📊</span>Обзор</button>
  <button class="tab" data-page="campaigns"><span class="tab-icon">📢</span>Кампании</button>
  <button class="tab" data-page="accounts"><span class="tab-icon">👤</span>Аккаунты</button>
  <button class="tab" data-page="jobs"><span class="tab-icon">📋</span>Задания</button>
</div>

<!-- ═══════════════ OVERVIEW ═══════════════ -->
<div id="page-overview" class="page active">
  <div id="overview-skeleton">
    <div class="stat-grid"><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div></div>
    <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
  </div>
  <div id="overview-content" style="display:none">
    <div id="bot-status-card"></div>
    <div id="error-alert"></div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-val" id="stat-accounts">–</div><div class="stat-lbl">Аккаунты</div></div>
      <div class="stat-card"><div class="stat-icon">📢</div><div class="stat-val" id="stat-campaigns">–</div><div class="stat-lbl">Кампании</div></div>
      <div class="stat-card"><div class="stat-icon">📤</div><div class="stat-val" id="stat-jobs-today">–</div><div class="stat-lbl">Сегодня</div></div>
    </div>

    <div class="section-title">Быстрые действия</div>
    <div class="actions-grid">
      <button class="action-btn" onclick="botAction('start')">
        <div class="action-icon action-icon-green">▶</div>Запустить бота
      </button>
      <button class="action-btn" onclick="botAction('stop')">
        <div class="action-icon action-icon-red">⏹</div>Остановить бота
      </button>
      <button class="action-btn" onclick="refreshAll()">
        <div class="action-icon action-icon-blue">🔄</div>Обновить
      </button>
      <button class="action-btn" onclick="showPage('campaigns')">
        <div class="action-icon action-icon-purple">📢</div>Кампании
      </button>
    </div>

    <div class="section-title">Последние задания</div>
    <div class="card">
      <div id="recent-jobs"></div>
    </div>
  </div>
</div>

<!-- ═══════════════ CAMPAIGNS ═══════════════ -->
<div id="page-campaigns" class="page">
  <div id="campaigns-skeleton">
    <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
  </div>
  <div id="campaigns-list"></div>
</div>

<!-- ═══════════════ ACCOUNTS ═══════════════ -->
<div id="page-accounts" class="page">
  <div id="accounts-skeleton">
    <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
  </div>
  <div id="accounts-list"></div>
</div>

<!-- ═══════════════ JOBS ═══════════════ -->
<div id="page-jobs" class="page">
  <div id="jobs-skeleton">
    <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
  </div>
  <div id="jobs-content" style="display:none">
    <div id="jobs-stats-bar"></div>
    <div id="jobs-list"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
tg?.ready();
tg?.setHeaderColor?.('#0f0a1a');
tg?.setBackgroundColor?.('#0f0a1a');

const BASE = window.location.origin;
let token = null, me = null, subData = null;
let _autoRefreshTimer = null;
const AUTO_REFRESH_MS = 30000; // 30 секунд

/* ── Haptic ──────────────────────────────────────────────── */
function haptic(type = 'light') {
  try { tg?.HapticFeedback?.impactOccurred?.(type); } catch {}
}

/* ── Toast ───────────────────────────────────────────────── */
function showToast(msg, icon = 'ℹ️') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">${icon}</span><span>${esc(msg)}</span>`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2500);
  setTimeout(() => el.remove(), 2800);
}

/* ── API ─────────────────────────────────────────────────── */
async function api(path, opts = {}) {
  // Cache-busting: Telegram WebView агрессивно кэширует GET
  const sep = path.includes('?') ? '&' : '?';
  const url = BASE + '/api' + path + sep + '_t=' + Date.now();
  const res = await fetch(url, {
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'Cache-Control': 'no-cache',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.error || res.statusText);
  }
  return res.json();
}

/* ── Auth ────────────────────────────────────────────────── */
async function authInit() {
  const initData = tg?.initData;
  if (!initData) {
    document.getElementById('user-name').textContent = '⚠️ Откройте через Telegram';
    document.getElementById('plan-badge').textContent = '';
    return false;
  }
  try {
    const data = await api('/bot/miniapp/auth', {
      method: 'POST',
      body: { init_data: initData },
    });
    token   = data.access_token;
    me      = data.user;
    subData = data.subscription;

    const name = me.name || me.email?.split('@')[0] || 'Пользователь';
    document.getElementById('user-name').textContent = `Привет, ${name}!`;

    const planName = subData?.plan_name || 'Free';
    const badge = document.getElementById('plan-badge');
    badge.textContent = '✨ ' + planName;

    return true;
  } catch (e) {
    document.getElementById('user-name').textContent = '⚠️ Ошибка авторизации';
    document.getElementById('plan-badge').textContent = '';
    return false;
  }
}

/* ── Tabs ────────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    haptic('light');
    const page = tab.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    tab.classList.add('active');
    loadPage(page);
  });
});

function showPage(name) {
  haptic('light');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector(`.tab[data-page="${name}"]`)?.classList.add('active');
  loadPage(name);
}

function loadPage(name, silent = false) {
  if (!token) return;
  const loaders = { overview: loadOverview, campaigns: loadCampaigns, accounts: loadAccounts, jobs: loadJobs };
  loaders[name]?.(silent);
}

/* ── Overview ────────────────────────────────────────────── */
async function loadOverview(silent = false) {
  if (!silent) { show('overview-skeleton'); hide('overview-content'); }
  flashRefreshIndicator();
  try {
    const [profiles, campaigns, jobsData, botStatus] = await Promise.all([
      api('/profiles'),
      api('/campaigns'),
      api('/jobs?limit=5'),
      api('/bot/status').catch(() => null),
    ]);

    const jobs  = jobsData.jobs || [];
    const today = jobs.filter(j => isToday(j.scheduled_at || j.created_at)).length;

    setText('stat-accounts', profiles.length);
    setText('stat-campaigns', campaigns.length);
    setText('stat-jobs-today', today);

    // Обновляем статус бота в хедере
    updateHeaderBotStatus(botStatus);

    // Bot status card
    const bs = document.getElementById('bot-status-card');
    if (botStatus) {
      const on = botStatus.running === true;
      bs.innerHTML = `
        <div class="bot-status ${on ? 'online' : 'offline'}">
          <div class="bot-dot ${on ? 'online' : 'offline'}"></div>
          <div class="bot-info">
            <div class="bot-label">Steam бот ${on ? 'активен' : 'остановлен'}</div>
            <div class="bot-meta">${on ? 'Работает нормально' : 'Нажмите "Запустить" для старта'}</div>
          </div>
          <button class="btn-ghost" onclick="botAction('${on ? 'stop' : 'start'}')">${on ? '⏹ Стоп' : '▶ Старт'}</button>
        </div>`;
    } else {
      bs.innerHTML = '';
    }

    // Error alert
    const ea = document.getElementById('error-alert');
    const failedJobs = jobs.filter(j => j.status === 'failed');
    if (failedJobs.length > 0) {
      ea.innerHTML = `<div class="error-banner">⚠️ ${failedJobs.length} заданий завершились с ошибкой</div>`;
    } else { ea.innerHTML = ''; }

    // Recent jobs
    const rj = document.getElementById('recent-jobs');
    if (jobs.length === 0) {
      rj.innerHTML = '<div class="empty" style="padding:20px 0"><div class="empty-text">Заданий пока нет</div></div>';
    } else {
      rj.innerHTML = jobs.map(jobRow).join('');
    }

    hide('overview-skeleton'); show('overview-content');
  } catch(e) {
    showToast('Ошибка: ' + e.message, '❌');
    hide('overview-skeleton');
  }
}

/* ── Bot actions ─────────────────────────────────────────── */
async function botAction(action) {
  haptic('medium');
  try {
    showToast(action === 'start' ? 'Запуск бота...' : 'Остановка бота...', '⏳');
    await api('/bot/' + action, { method: 'POST' });
    showToast(action === 'start' ? 'Бот запущен!' : 'Бот остановлен', action === 'start' ? '✅' : '⏹');
    // Обновляем хедер сразу
    updateHeaderBotStatus({ running: action === 'start' });
    setTimeout(() => loadOverview(true), 1000);
  } catch(e) {
    showToast('Ошибка: ' + e.message, '❌');
    haptic('error');
  }
}

function refreshAll() {
  haptic('light');
  showToast('Обновление...', '🔄');
  const activePage = document.querySelector('.page.active')?.id?.replace('page-','');
  loadPage(activePage || 'overview', false);
}

/* ── Campaigns ───────────────────────────────────────────── */
async function loadCampaigns(silent = false) {
  if (!silent) { show('campaigns-skeleton'); setHtml('campaigns-list', ''); }
  flashRefreshIndicator();
  try {
    const campaigns = await api('/campaigns');
    const el = document.getElementById('campaigns-list');
    if (!campaigns.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📢</div><div class="empty-title">Кампаний нет</div><div class="empty-text">Создайте первую кампанию в панели управления</div></div>`;
    } else {
      el.innerHTML = campaigns.map(c => `
        <div class="campaign-card">
          <div class="campaign-row">
            <div class="campaign-info">
              <div class="campaign-name">${esc(c.name)}</div>
              <div class="campaign-tpl">${esc(c.title_template || '—')}</div>
            </div>
            <button class="toggle ${c.is_active ? 'on' : ''}" onclick="toggleCampaign('${c.id}', ${!c.is_active}, this)" aria-label="Toggle"></button>
          </div>
          ${c.schedule_cron ? `<div style="margin-top:6px;font-size:12px;color:var(--hint)">⏰ ${esc(c.schedule_cron)}</div>` : ''}
        </div>`).join('');
    }
    hide('campaigns-skeleton');
  } catch(e) { showToast('Ошибка: ' + e.message, '❌'); hide('campaigns-skeleton'); }
}

async function toggleCampaign(id, active, btn) {
  haptic('medium');
  btn.classList.toggle('on', active);
  try {
    await api('/campaigns/' + id, { method: 'PATCH', body: { is_active: active } });
    showToast(active ? 'Кампания запущена' : 'Кампания на паузе', active ? '▶' : '⏸');
  } catch(e) {
    btn.classList.toggle('on', !active);
    showToast('Ошибка: ' + e.message, '❌');
    haptic('error');
  }
}

/* ── Accounts ────────────────────────────────────────────── */
async function loadAccounts(silent = false) {
  if (!silent) { show('accounts-skeleton'); setHtml('accounts-list', ''); }
  flashRefreshIndicator();
  try {
    const profiles = await api('/profiles');
    const el = document.getElementById('accounts-list');
    if (!profiles.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">👤</div><div class="empty-title">Аккаунтов нет</div><div class="empty-text">Добавьте Steam аккаунт в панели управления</div></div>`;
    } else {
      el.innerHTML = profiles.map(p => {
        const statusMap = { active: ['Активен','badge-green'], invalid: ['Невалид','badge-red'], checking: ['Проверка','badge-yellow'] };
        const [label, cls] = statusMap[p.status] || [p.status, 'badge-gray'];
        return `
          <div class="account-card">
            <div class="account-avatar">🎮</div>
            <div class="account-info">
              <div class="account-name">${esc(p.name)}</div>
              ${p.target_url ? `<a class="account-url" href="${esc(p.target_url)}" target="_blank">Открыть профиль ↗</a>` : '<span class="card-sub">URL не указан</span>'}
            </div>
            <span class="badge ${cls}">${label}</span>
          </div>`;
      }).join('');
    }
    hide('accounts-skeleton');
  } catch(e) { showToast('Ошибка: ' + e.message, '❌'); hide('accounts-skeleton'); }
}

/* ── Jobs ────────────────────────────────────────────────── */
async function loadJobs(silent = false) {
  if (!silent) { show('jobs-skeleton'); hide('jobs-content'); }
  flashRefreshIndicator();
  try {
    const { jobs, total } = await api('/jobs?limit=40');
    if (!jobs?.length) {
      hide('jobs-skeleton');
      show('jobs-content');
      setHtml('jobs-stats-bar', '');
      setHtml('jobs-list', `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Заданий нет</div></div>`);
      return;
    }

    // Stats
    const counts = { done: 0, failed: 0, pending: 0, running: 0 };
    jobs.forEach(j => { if (counts[j.status] !== undefined) counts[j.status]++; });
    const tot = jobs.length || 1;

    setHtml('jobs-stats-bar', `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <span class="card-title">Статистика</span>
          <span class="card-sub">Всего: ${total}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-seg" style="width:${counts.done/tot*100}%;background:var(--green)"></div>
          <div class="progress-seg" style="width:${counts.running/tot*100}%;background:var(--blue)"></div>
          <div class="progress-seg" style="width:${counts.pending/tot*100}%;background:var(--yellow)"></div>
          <div class="progress-seg" style="width:${counts.failed/tot*100}%;background:var(--red)"></div>
        </div>
        <div class="job-stats">
          <div class="job-stat"><div class="job-dot" style="background:var(--green)"></div>Готово ${counts.done}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--blue)"></div>Идёт ${counts.running}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--yellow)"></div>Ждёт ${counts.pending}</div>
          <div class="job-stat"><div class="job-dot" style="background:var(--red)"></div>Ошибка ${counts.failed}</div>
        </div>
      </div>`);

    setHtml('jobs-list', jobs.map(jobRow).join(''));
    hide('jobs-skeleton'); show('jobs-content');
  } catch(e) { showToast('Ошибка: ' + e.message, '❌'); hide('jobs-skeleton'); }
}

/* ── Helpers ──────────────────────────────────────────────── */
function jobRow(j) {
  const cfg = {
    done:    { icon: '✅', label: 'Готово',  badge: 'badge-green' },
    failed:  { icon: '❌', label: 'Ошибка',  badge: 'badge-red' },
    pending: { icon: '⏳', label: 'Ждёт',    badge: 'badge-yellow' },
    running: { icon: '🔄', label: 'Идёт',    badge: 'badge-blue' },
  };
  const c = cfg[j.status] || { icon: '⏳', label: j.status, badge: 'badge-gray' };
  const time = fmtTime(j.scheduled_at || j.created_at);
  const errText = j.error_message || j.error || '';
  return `
    <div class="row">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${c.icon} ${esc(j.campaign_name || 'Кампания')}</div>
        <div style="font-size:12px;color:var(--hint);margin-top:1px">${esc(j.profile_name || '')} · ${time}</div>
        ${errText ? `<div style="font-size:11px;color:var(--red);margin-top:3px;word-break:break-word">${esc(errText)}</div>` : ''}
      </div>
      <span class="badge ${c.badge}">${c.label}</span>
    </div>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id) { const el = document.getElementById(id); if(el) el.style.display = ''; }
function hide(id) { const el = document.getElementById(id); if(el) el.style.display = 'none'; }
function setText(id, v) { const el = document.getElementById(id); if(el) el.textContent = v; }
function setHtml(id, v) { const el = document.getElementById(id); if(el) el.innerHTML = v; }
function isToday(d) { return new Date(d).toDateString() === new Date().toDateString(); }
function fmtTime(d) { return new Date(d).toLocaleString('ru', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }

/* ── Auto-refresh ────────────────────────────────────────── */
function startAutoRefresh() {
  stopAutoRefresh();
  _autoRefreshTimer = setInterval(() => {
    const activePage = document.querySelector('.page.active')?.id?.replace('page-','');
    if (activePage && token) {
      loadPage(activePage, true); // silent = true — без скелетона
    }
  }, AUTO_REFRESH_MS);
}

function stopAutoRefresh() {
  if (_autoRefreshTimer) { clearInterval(_autoRefreshTimer); _autoRefreshTimer = null; }
}

function flashRefreshIndicator() {
  const el = document.getElementById('refresh-indicator');
  if (!el) return;
  el.classList.add('updating');
  setTimeout(() => el.classList.remove('updating'), 1500);
}

function updateHeaderBotStatus(botStatus) {
  const el = document.getElementById('header-bot-status');
  if (!el) return;
  if (botStatus && botStatus.running === true) {
    el.innerHTML = '<span class="header-bot-dot online"></span> Бот активен';
    el.style.color = 'var(--green)';
  } else {
    el.innerHTML = '<span class="header-bot-dot offline"></span> Бот остановлен';
    el.style.color = 'var(--red)';
  }
}

// Остановка при сворачивании, запуск при открытии
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAutoRefresh();
  } else if (token) {
    const activePage = document.querySelector('.page.active')?.id?.replace('page-','');
    if (activePage) loadPage(activePage, true);
    startAutoRefresh();
  }
});

/* ── Init ────────────────────────────────────────────────── */
(async () => {
  const ok = await authInit();
  if (ok) {
    await loadOverview();
    startAutoRefresh();
  }
})();
</script>
